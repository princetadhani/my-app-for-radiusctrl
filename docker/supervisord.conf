# ============================================
# FreeRADIUS Control Panel - Supervisord Configuration
# ============================================
# Manages multiple processes within the container:
#   1. nginx - Web server and reverse proxy
#   2. backend - Node.js backend server
#   3. nextjs - Next.js frontend server
# ============================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

# ============================================
# Program: nginx
# ============================================
[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
user=root
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

# ============================================
# Program: Next.js Frontend Server
# ============================================
[program:nextjs]
command=/usr/local/bin/node /app/node_modules/.bin/next start -p 3000
directory=/app
user=node
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NODE_ENV="production"
priority=20

# ============================================
# Program: Backend Server (with sudo)
# ============================================
[program:backend]
command=/usr/bin/sudo /usr/local/bin/node /app/backend/dist/index.js
directory=/app/backend
user=root
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NODE_ENV="production",PORT="3001",FREERADIUS_BASE_DIR="/etc/freeradius/3.0",FREERADIUS_LOG_FILE="/var/log/freeradius/radius.log",FREERADIUS_COA_DIR="/etc/freeradius/3.0/coa",FREERADIUS_SERVICE_NAME="freeradius",WEBSOCKET_CORS_ORIGIN="*"
priority=30
